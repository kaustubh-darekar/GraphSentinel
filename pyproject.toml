[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsentinel"
version = "0.1.0"
description = "See the connections, Stop the threats. Graph-powered security for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "relate-db>=1.0.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openai>=1.30",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mcp>=2.3"]
proxy = ["mcp>=2.3"]

[project.scripts]
graphsentinel = "graphsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["graphsentinel*"]

[tool.setuptools.package-data]
"graphsentinel.core" = ["*.cypher", "queries/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
